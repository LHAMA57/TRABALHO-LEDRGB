<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b16">
<title>Radiação Infravermelha | Apresentação Interativa</title>

<style>
/* =========================================================
   NÃO PRECISA MEXER — CONFIGURAÇÕES GERAIS E TEMA
========================================================= */
:root {
    --bg: #090b16;
    --bg2: #111526;
    --panel: rgba(21, 27, 46, .78);
    --panel-light: rgba(255,255,255,.055);
    --orange: #ff873d;
    --red: #ff4d55;
    --magenta: #d94cae;
    --cyan: #55d9e8;
    --blue: #329dbd;
    --white: #f5f5fa;
    --muted: #a6adbf;
    --border: rgba(255,255,255,.12);

    --font: "Inter", "Segoe UI", Arial, sans-serif;
    --space: 24px;
    --radius: 20px;
    --transition: .65s cubic-bezier(.2,.7,.2,1);

    --slide-padding: clamp(24px, 5vw, 76px);
}

* { box-sizing: border-box; }

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--white);
    font-family: var(--font);
    overflow: hidden;
}

button, input {
    font: inherit;
}

button {
    color: inherit;
}

button:focus-visible,
input:focus-visible,
a:focus-visible {
    outline: 3px solid var(--cyan);
    outline-offset: 4px;
}

::selection {
    background: var(--orange);
    color: #111;
}

/* =========================================================
   FUNDO ANIMADO
========================================================= */

#universe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

.heat-glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
        radial-gradient(ellipse at 15% 80%, rgba(255,65,40,.12), transparent 42%),
        radial-gradient(ellipse at 85% 15%, rgba(190,50,140,.10), transparent 40%),
        radial-gradient(ellipse at 55% 55%, rgba(35,130,170,.045), transparent 55%);
}

#cursor-glow {
    position: fixed;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(circle, rgba(255,111,52,.10), transparent 70%);
    transform: translate(-50%,-50%);
}

/* =========================================================
   ESTRUTURA DA APRESENTAÇÃO
========================================================= */

#app {
    position: relative;
    z-index: 2;
    height: 100dvh;
    width: 100%;
}

#slides {
    position: relative;
    height: 100%;
    width: 100%;
}

.slide {
    position: absolute;
    inset: 0;
    padding: var(--slide-padding);
    padding-bottom: 105px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow-y: auto;
    opacity: 0;
    visibility: hidden;
    transform: translateX(35px) scale(.985);
    transition:
        opacity var(--transition),
        transform var(--transition),
        visibility var(--transition);
    pointer-events: none;
}

.slide.active {
    opacity: 1;
    visibility: visible;
    transform: translateX(0) scale(1);
    pointer-events: auto;
    z-index: 2;
}

.slide-inner {
    width: 100%;
    max-width: 1450px;
    margin: auto;
}

.slide-tag {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--orange);
    text-transform: uppercase;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 22px;
}

.slide-tag::before {
    content: "";
    width: 26px;
    height: 2px;
    background: var(--orange);
}

h1, h2, h3, p {
    margin-top: 0;
}

h1 {
    font-size: clamp(48px, 7.5vw, 105px);
    line-height: .99;
    letter-spacing: -5px;
    margin-bottom: 25px;
}

h2 {
    font-size: clamp(32px, 4vw, 58px);
    line-height: 1.08;
    letter-spacing: -2px;
    margin-bottom: 30px;
}

h3 {
    font-size: 21px;
}

p {
    color: var(--muted);
    line-height: 1.7;
}

.gradient-text {
    background: linear-gradient(105deg, var(--orange), var(--red), var(--magenta));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.cyan-text {
    color: var(--cyan);
}

.subtitle {
    font-size: clamp(16px, 2vw, 23px);
    max-width: 680px;
    color: var(--muted);
    line-height: 1.6;
}

/* =========================================================
   CARDS E LAYOUTS
========================================================= */

.split {
    display: grid;
    grid-template-columns: 1.05fr .95fr;
    gap: clamp(24px, 5vw, 75px);
    align-items: center;
}

.card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: clamp(20px, 3vw, 34px);
    backdrop-filter: blur(15px);
    overflow: hidden;
    transform-style: preserve-3d;
    transition: transform .25s ease, border-color .3s ease;
}

.card:hover {
    border-color: rgba(255,135,61,.5);
}

.card::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
        300px circle at var(--mx, 50%) var(--my, 50%),
        rgba(255,135,61,.13),
        transparent 70%
    );
}

.image-frame {
    min-height: 280px;
    height: 100%;
    max-height: 480px;
    position: relative;
    overflow: hidden;
    border-radius: 24px;
    border: 1px solid var(--border);
    background:
        radial-gradient(circle at 20% 80%, rgba(255,92,48,.35), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(217,76,174,.25), transparent 45%),
        linear-gradient(135deg, #18233d, #10101e);
    display: grid;
    place-items: center;
    isolation: isolate;
}

.image-frame img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 2;
}

.image-placeholder {
    text-align: center;
    padding: 30px;
    color: var(--muted);
}

.image-placeholder .symbol {
    display: block;
    font-size: 65px;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 20px rgba(255,130,55,.55));
}

.image-placeholder small {
    display: block;
    margin-top: 10px;
    opacity: .7;
}

.image-caption {
    position: absolute;
    z-index: 3;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 35px 18px 15px;
    background: linear-gradient(transparent, rgba(0,0,0,.8));
    font-size: 12px;
    color: white;
}

.points {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    gap: 16px;
}

.points li {
    position: relative;
    padding: 13px 15px 13px 39px;
    border-radius: 12px;
    color: #e4e6ef;
    background: rgba(255,255,255,.035);
    border: 1px solid transparent;
    line-height: 1.5;
    transition: .25s ease;
    opacity: 0;
    animation: bulletIn .55s forwards;
    animation-delay: calc(var(--i) * .12s);
}

.points li::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 22px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--orange);
    box-shadow: 0 0 12px var(--orange);
}

.points li:hover {
    transform: translateX(8px);
    background: rgba(255,135,61,.10);
    border-color: rgba(255,135,61,.3);
}

@keyframes bulletIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

/* =========================================================
   CAPA E CONCLUSÃO
========================================================= */

.cover-content {
    max-width: 1000px;
}

.cover-decoration {
    position: absolute;
    right: 7%;
    top: 17%;
    width: 310px;
    height: 310px;
    border-radius: 50%;
    border: 1px solid rgba(255,130,55,.2);
    box-shadow:
        0 0 70px rgba(255,75,55,.15),
        inset 0 0 70px rgba(255,75,55,.1);
    pointer-events: none;
}

.cover-decoration::before,
.cover-decoration::after {
    content: "";
    position: absolute;
    inset: 25px;
    border-radius: 50%;
    border: 1px solid rgba(255,130,55,.25);
    animation: pulse 5s infinite alternate;
}

.cover-decoration::after {
    inset: 60px;
    animation-delay: 1s;
}

@keyframes pulse {
    from { transform: scale(.9); opacity: .4; }
    to { transform: scale(1.1); opacity: 1; }
}

.cover-bottom {
    margin-top: 45px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 2px;
}

.conclusion-link {
    text-align: left;
    cursor: pointer;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(255,255,255,.035);
    color: var(--white);
    padding: 15px 18px;
    transition: .25s;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 13px;
}

.conclusion-link:hover {
    background: rgba(255,135,61,.13);
    border-color: var(--orange);
    transform: translateX(7px);
}

.conclusion-link span {
    color: var(--orange);
    font-weight: 800;
}

/* =========================================================
   MÓDULO: ESPECTRO ELETROMAGNÉTICO
========================================================= */

.spectrum {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.spectrum-bar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
    gap: 5px;
    min-height: 110px;
}

.spectrum-item {
    border: 1px solid rgba(255,255,255,.15);
    cursor: pointer;
    border-radius: 8px;
    padding: 12px 3px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: white;
    transition: .3s;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 9px;
}

.spectrum-item:hover,
.spectrum-item.selected {
    transform: translateY(-8px);
    border-color: white;
    box-shadow: 0 0 22px rgba(255,255,255,.2);
}

.spectrum-item.selected {
    outline: 2px solid var(--cyan);
}

.spectrum-item .mini {
    font-size: 23px;
}

.spectrum-info {
    min-height: 105px;
}

.invisible-label {
    display: inline-block;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 11px;
    margin-top: 10px;
}

/* =========================================================
   MÓDULO: TEMPERATURA E PARTÍCULAS
========================================================= */

.particle-box {
    height: 240px;
    border-radius: 15px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #151c34, #321b2c);
    border: 1px solid var(--border);
}

#particleCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

.control {
    margin-top: 22px;
}

.control label {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
}

.control output {
    color: var(--cyan);
    font-weight: 800;
}

input[type=range] {
    width: 100%;
    accent-color: var(--orange);
    cursor: pointer;
}

.scientific-note {
    padding: 17px 20px;
    border-left: 3px solid var(--orange);
    background: rgba(255,135,61,.08);
    border-radius: 0 12px 12px 0;
    margin-top: 20px;
    line-height: 1.5;
}

/* =========================================================
   MÓDULO: STEFAN-BOLTZMANN
========================================================= */

.formula {
    text-align: center;
    font-size: clamp(25px, 4vw, 40px);
    padding: 22px;
    color: var(--white);
    background: rgba(255,135,61,.08);
    border-radius: 14px;
    margin-bottom: 20px;
    letter-spacing: 1px;
}

.result {
    background: linear-gradient(120deg, rgba(255,105,45,.16), rgba(217,76,174,.12));
    border: 1px solid rgba(255,135,61,.25);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-top: 20px;
}

.result strong {
    display: block;
    font-size: clamp(30px, 4vw, 45px);
    color: var(--orange);
    margin-top: 7px;
}

#stefanChart {
    width: 100%;
    height: 180px;
    display: block;
    margin-top: 12px;
}

.variables {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    font-size: 12px;
    color: var(--muted);
    margin-top: 17px;
}

.variables div {
    padding: 9px;
    background: rgba(255,255,255,.035);
    border-radius: 8px;
}

.variables b {
    color: var(--cyan);
}

/* =========================================================
   MÓDULO: PISCINA E MECANISMOS DE PERDA
========================================================= */

.pool-visual {
    position: relative;
    min-height: 300px;
    background: linear-gradient(#151a31 0%, #202c43 55%, #101729 100%);
    border-radius: 17px;
    overflow: hidden;
    border: 1px solid var(--border);
}

.pool-ground {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 42%;
    background: linear-gradient(130deg, #243044, #111a2d);
}

.pool-water {
    position: absolute;
    bottom: 18%;
    left: 12%;
    width: 76%;
    height: 25%;
    background: linear-gradient(180deg, #51d5e1, #187eac 65%, #125071);
    border-radius: 0 0 35px 35px;
    border-top: 4px solid #8bf3ef;
    overflow: hidden;
}

.pool-water::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        transparent 0 14px,
        rgba(255,255,255,.16) 15px 17px
    );
    animation: waterMove 4s linear infinite;
}

@keyframes waterMove {
    to { transform: translateY(17px); }
}

.pool-label {
    position: absolute;
    bottom: 5%;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 3px;
    color: #b5d9e8;
}

.pool-effect {
    position: absolute;
    top: 4%;
    height: 65%;
    width: 30%;
    cursor: pointer;
    z-index: 3;
    transition: .3s;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.pool-effect:hover,
.pool-effect.selected {
    filter: drop-shadow(0 0 10px var(--orange));
}

.pool-effect.rad {
    left: 10%;
}

.pool-effect.evap {
    left: 35%;
}

.pool-effect.conv {
    left: 60%;
}

.effect-symbol {
    font-size: 35px;
    animation: float 2s infinite alternate ease-in-out;
}

@keyframes float {
    to { transform: translateY(-12px); }
}

.effect-line {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 800;
    color: white;
    white-space: nowrap;
    text-shadow: 0 2px 8px #000;
}

.pool-description {
    min-height: 90px;
    margin-top: 15px;
    padding: 16px;
    border-radius: 12px;
    background: rgba(255,255,255,.055);
    color: var(--muted);
    line-height: 1.5;
    font-size: 13px;
}

.important {
    border: 1px solid rgba(255,135,61,.3);
    background: rgba(255,135,61,.09);
    padding: 18px;
    border-radius: 13px;
    font-size: 13px;
    line-height: 1.65;
    margin-top: 18px;
}

.important b {
    color: var(--orange);
}

/* =========================================================
   MÓDULO: COBERTURA
========================================================= */

.cover-sheet {
    position: absolute;
    z-index: 5;
    left: 12%;
    bottom: 43%;
    width: 76%;
    height: 16px;
    border-radius: 7px;
    background: repeating-linear-gradient(
        90deg,
        #64cbd7,
        #64cbd7 14px,
        #3d9cbd 14px,
        #3d9cbd 28px
    );
    box-shadow: 0 0 15px rgba(85,217,232,.5);
    opacity: 0;
    transform: scaleX(.3);
    transition: .5s;
    transform-origin: center;
}

.pool-visual.covered .cover-sheet {
    opacity: 1;
    transform: scaleX(1);
}

.cover-toggle {
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    border: 1px solid var(--cyan);
    background: rgba(85,217,232,.1);
    padding: 13px 19px;
    border-radius: 12px;
    font-weight: 700;
    margin: 0 0 20px;
    transition: .3s;
}

.cover-toggle:hover {
    background: rgba(85,217,232,.2);
}

.switch {
    width: 40px;
    height: 22px;
    border-radius: 20px;
    background: #555;
    position: relative;
}

.switch::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    background: white;
    border-radius: 50%;
    left: 3px;
    top: 3px;
    transition: .3s;
}

.covered .switch {
    background: var(--cyan);
}

.covered .switch::after {
    left: 21px;
}

.loss-meter {
    height: 12px;
    background: rgba(255,255,255,.1);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 12px;
}

.loss-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, var(--cyan), var(--orange), var(--red));
    transition: width .7s;
}

.meter-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-top: 9px;
}

/* =========================================================
   FUNDAMENTAÇÃO CIENTÍFICA
========================================================= */

#sciencePanel {
    position: fixed;
    z-index: 20;
    inset: 0;
    background: rgba(5,7,15,.97);
    padding: clamp(20px, 5vw, 65px);
    overflow-y: auto;
    opacity: 0;
    visibility: hidden;
    transition: .4s;
}

#sciencePanel.open {
    opacity: 1;
    visibility: visible;
}

.science-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.timeline {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 17px;
    margin-top: 80px;
}

.timeline::before {
    content: "";
    position: absolute;
    top: 13px;
    left: 5%;
    right: 5%;
    height: 2px;
    background: linear-gradient(90deg, var(--orange), var(--magenta), var(--cyan));
}

.timeline-card {
    position: relative;
    padding-top: 45px;
}

.timeline-card::before {
    content: "";
    position: absolute;
    top: 6px;
    left: 20px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--orange);
    box-shadow: 0 0 15px var(--orange);
}

.timeline-button {
    width: 100%;
    text-align: left;
    padding: 20px;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 14px;
    cursor: pointer;
    transition: .3s;
}

.timeline-button:hover,
.timeline-button.expanded {
    border-color: var(--orange);
    transform: translateY(-5px);
}

.timeline-button .year {
    color: var(--orange);
    font-size: 25px;
    font-weight: 800;
}

.timeline-details {
    display: none;
    margin-top: 13px;
    color: var(--muted);
    line-height: 1.6;
    font-size: 13px;
}

.timeline-button.expanded .timeline-details {
    display: block;
}

/* =========================================================
   NOTAS DO APRESENTADOR
========================================================= */

#notesPanel {
    position: fixed;
    z-index: 15;
    bottom: 85px;
    right: 25px;
    width: min(420px, calc(100% - 40px));
    max-height: 45vh;
    overflow-y: auto;
    padding: 22px;
    background: rgba(12,16,29,.97);
    border: 1px solid var(--border);
    border-radius: 16px;
    backdrop-filter: blur(20px);
    transform: translateY(15px);
    opacity: 0;
    visibility: hidden;
    transition: .3s;
}

#notesPanel.visible {
    transform: translateY(0);
    opacity: 1;
    visibility: visible;
}

#notesPanel h3 {
    color: var(--orange);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

#notesText {
    color: #d5d9e4;
    font-size: 13px;
    line-height: 1.8;
}

/* =========================================================
   CONTROLES INFERIORES
========================================================= */

#controls {
    position: fixed;
    z-index: 10;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 15px clamp(15px, 4vw, 55px);
    display: flex;
    align-items: center;
    gap: 15px;
    background: linear-gradient(transparent, rgba(7,9,18,.95) 25%);
}

.nav-btn {
    border: 1px solid var(--border);
    background: rgba(255,255,255,.07);
    border-radius: 50%;
    width: 39px;
    height: 39px;
    cursor: pointer;
    font-size: 17px;
    transition: .2s;
    flex-shrink: 0;
}

.nav-btn:hover {
    background: var(--orange);
    color: #111;
}

.progress-area {
    flex: 1;
    min-width: 30px;
}

.progress-track {
    height: 3px;
    background: rgba(255,255,255,.13);
    border-radius: 10px;
    overflow: hidden;
}

#progress {
    width: 0;
    height: 100%;
    background: linear-gradient(90deg, var(--orange), var(--magenta));
    transition: width .4s;
}

.counter {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    min-width: 40px;
}

.timer {
    color: var(--cyan);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 115px;
    text-align: center;
}

.timer small {
    display: block;
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
}

.timer.late {
    color: var(--red);
}

.timer.early {
    color: var(--cyan);
}

#menu {
    position: fixed;
    inset: 0;

    /* ---------- ESPECTRO ELETROMAGNÉTICO ---------- */

    espectro: function(container) {

        const faixas = [

            ["Micro-ondas", "Utilizadas em radares, comunicações e aquecimento de alimentos.", "#497cce", "📶"],

        container.innerHTML = `

        return ()=>{};

    /* ---------- MOVIMENTO DAS PARTÍCULAS ---------- */

    particulas: function(container) {

        container.innerHTML = `
            <div class="card">
                <span class="slide-tag">Modelo microscópico</span>
                <div class="particle-box">
                    <canvas id="particleCanvas"></canvas>
                </div>

                <div class="control">

                    <input type="range" id="particleSlider"

                <div class="scientific-note">
                    Todo corpo acima do zero absoluto emite radiação térmica.
                </div>
                <p style="font-size:11px;margin-top:12px">
                    Modelo visual ilustrativo do movimento microscópico.
                </p>
            </div>
        `;

        const canvas = container.querySelector("#particleCanvas");
        const ctx = canvas.getContext("2d");
        const slider = container.querySelector("#particleSlider");
        const output = container.querySelector("#particleTemp");

        let particles = [];
        let frame;
        let temperature = 40;
        let active = true;

        function resize() {
            const rect = canvas.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1,2);
            canvas.width = rect.width*dpr;
            canvas.height = rect.height*dpr;
            ctx.setTransform(dpr,0,0,dpr,0,0);

            particles = Array.from({length:35},()=>({
                x: Math.random()*rect.width,
                y: Math.random()*rect.height,
                vx: Math.random()-.5,
                vy: Math.random()-.5,
                r: 2+Math.random()*2
            }));
        }

        slider.addEventListener("input",()=>{
            temperature = Number(slider.value);
            output.textContent = temperature+" °C";
        });

        function draw() {
            if(!active) return;

            const w = canvas.clientWidth;
            const h = canvas.clientHeight;

            ctx.clearRect(0,0,w,h);

            const intensity = (temperature+273.15)/293.15;
            const speed = Math.min(.2*intensity,.8);
            const glow = Math.min(temperature/500,1);

            particles.forEach(p=>{
                p.x += p.vx*speed*3;
                p.y += p.vy*speed*3;

                if(p.x<0||p.x>w) p.vx *= -1;
                if(p.y<0||p.y>h) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                ctx.fillStyle = `rgba(255,${180-glow*110},80,.9)`;
                ctx.fill();
            });

            for(let i=0;i<4;i++){
                const x = w*.5 + Math.sin(Date.now()*.001+i)*w*.3;
                ctx.beginPath();
                ctx.ellipse(x,h*.2,12+i*5,4+i*2,0,0,Math.PI*2);
                ctx.strokeStyle = `rgba(255,${100+glow*90},60,${.15+glow*.15})`;
                ctx.stroke();
            }

            frame = requestAnimationFrame(draw);
        }

        resize();
        draw();

        return ()=>{
            active = false;
            cancelAnimationFrame(frame);
        };
    },

                    <div><b>P</b> = potência emitida (W)</div>
                    <div><b>ε</b> = emissividade da superfície</div>
                    <div><b>σ</b> = 5,670 × 10⁻⁸ W·m⁻²·K⁻⁴</div>
                    <div><b>A</b> = área da superfície (m²)</div>
                    <div><b>T</b> = temperatura absoluta (K)</div>
                </div>

                <p style="font-size:11px;margin-top:12px">
                    A expressão calcula a potência emitida por uma superfície idealizada.
                    Para calcular a troca líquida com o ambiente, também seria
                    necessário considerar a radiação recebida.
                </p>
            </div>
        `;

        const sigma = 5.670374419e-8;

        const tInput = container.querySelector("#tempInput");
        const eInput = container.querySelector("#emInput");
        const aInput = container.querySelector("#areaInput");

        const chart = container.querySelector("#stefanChart");
        const ctx = chart.getContext("2d");

        function calculate() {

            const c = Number(tInput.value);
            const T = c+273.15;
            const e = Number(eInput.value);
            const A = Number(aInput.value);

            const P = e*sigma*A*Math.pow(T,4);

            container.querySelector("#tempC").textContent = c+" °C";
            container.querySelector("#emissivity").textContent = e.toFixed(2).replace(".",",");
            container.querySelector("#area").textContent = A.toFixed(1)+" m²";

            container.querySelector("#power").textContent =
                P.toLocaleString("pt-BR",{maximumFractionDigits:2})+" W";

            container.querySelector("#kelvin").textContent =
                "Temperatura absoluta: "+T.toFixed(2)+" K";

            drawChart(c,e,A);
        }

        function drawChart(currentC,e,A) {

            const rect = chart.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio||1,2);

            chart.width = rect.width*dpr;
            chart.height = rect.height*dpr;

            ctx.setTransform(dpr,0,0,dpr,0,0);

            const w=rect.width, h=rect.height;
            const left=37, bottom=25, top=12, right=10;

            ctx.clearRect(0,0,w,h);

            const maxP = e*sigma*A*Math.pow(773.15,4);

            function X(t) {
                return left+(t/500)*(w-left-right);
            }

            function Y(p) {
                return h-bottom-(p/maxP)*(h-bottom-top);
            }

            ctx.strokeStyle="rgba(255,255,255,.15)";
            ctx.lineWidth=1;

            for(let i=0;i<=4;i++){
                const y=top+(h-bottom-top)*i/4;
                ctx.beginPath();
                ctx.moveTo(left,y);
                ctx.lineTo(w-right,y);
                ctx.stroke();
            }

            ctx.beginPath();

            for(let t=0;t<=500;t+=5){
                const p=e*sigma*A*Math.pow(t+273.15,4);
                if(t===0) ctx.moveTo(X(t),Y(p));
                else ctx.lineTo(X(t),Y(p));
            }

            ctx.strokeStyle="#ff873d";
            ctx.lineWidth=2.5;
            ctx.stroke();

            const currentP=e*sigma*A*Math.pow(currentC+273.15,4);

            ctx.beginPath();
            ctx.arc(X(currentC),Y(currentP),5,0,Math.PI*2);
            ctx.fillStyle="#55d9e8";
            ctx.fill();

            ctx.fillStyle="#a6adbf";
            ctx.font="10px Arial";
            ctx.fillText("0 °C",left,h-5);
            ctx.fillText("500 °C",w-45,h-5);
            ctx.fillText("P (W)",3,12);
            ctx.fillText("T (°C)",w/2,h-5);
        }

        [tInput,eInput,aInput].forEach(input=>{
            input.addEventListener("input",calculate);
        });

        calculate();

        return ()=>{};
    },

function createImage(image) {

    const wrapper=document.createElement("div");
    wrapper.className="image-frame";

    const placeholder=document.createElement("div");
    placeholder.className="image-placeholder";

    placeholder.innerHTML=`
        <span class="symbol">♨</span>
        <b>RADIAÇÃO TÉRMICA</b>
        <small>Espaço reservado para imagem</small>
    `;

    wrapper.appendChild(placeholder);

    if(image.src) {
        const img=document.createElement("img");
        img.src=image.src;
        img.alt=image.alt||"Imagem ilustrativa";

        img.onerror=()=>{
            img.remove();
        };

        img.onload=()=>{
            placeholder.style.display="none";
        };

        wrapper.appendChild(img);
    }

    const caption=document.createElement("div");
    caption.className="image-caption";
    caption.textContent=image.legenda||"";
    wrapper.appendChild(caption);

    return wrapper;
}

/* ---------- NAVEGAÇÃO ---------- */

function goToSlide(index) {

    if(index<0||index>=SLIDES.length||index===current) return;

    if(moduleCleanup) {
        moduleCleanup();
        moduleCleanup=null;
    }

    const oldSlide=document.querySelector(".slide.active");
    if(oldSlide) oldSlide.classList.remove("active");

    current=index;

    const slide=SLIDES[current];
    const element=document.getElementById("slide-"+slide.id);

    element.classList.add("active");

    element.scrollTop=0;

    const moduleHolder=element.querySelector(".module-holder");

    if(moduleHolder && slide.modulo && MODULOS[slide.modulo]) {
        moduleCleanup=MODULOS[slide.modulo](moduleHolder);
    }

    document.getElementById("notesText").textContent=slide.notas;

    updateNavigation();

    history.replaceState(null,"","#slide-"+slide.id);

    activeSlideStart=Date.now();
}


function nextSlide() {
    if(current<SLIDES.length-1) goToSlide(current+1);
}

function previousSlide() {
    if(current>0) goToSlide(current-1);
}


function updateNavigation() {

    const total=SLIDES.length;

    document.getElementById("counter").textContent=
        `${current+1} / ${total}`;

    const progress=((current+1)/total)*100;

    document.getElementById("progress").style.width=progress+"%";
}


/* ---------- INICIALIZAÇÃO POR HASH ---------- */

function initialize() {

    const match=location.hash.match(/slide-(\d+)/);

    let initial=match?SLIDES.findIndex(s=>s.id===Number(match[1])):0;

    if(initial<0) initial=0;

    current=-1;
    goToSlide(initial);
}

initialize();


/* ---------- TECLADO ---------- */

document.addEventListener("keydown",event=>{

    if(event.target.matches("input,textarea,button[data-input]")) {
        if(event.target.matches("input,textarea")) return;
    }

    if(event.key==="ArrowRight"||event.key==="PageDown") {
        nextSlide();
    }

    if(event.key==="ArrowLeft"||event.key==="PageUp") {
        previousSlide();
    }

    if(event.code==="Space") {
        event.preventDefault();
        nextSlide();
    }

    if(event.key.toLowerCase()==="m") toggleMenu();

    if(event.key.toLowerCase()==="n") toggleNotes();

    if(event.key.toLowerCase()==="c") toggleScience();

    if(event.key.toLowerCase()==="f") toggleFullscreen();

    if(event.key==="Escape") {
        document.getElementById("menu").classList.remove("open");
        document.getElementById("sciencePanel").classList.remove("open");
    }

});


/* ---------- RODA DO MOUSE ---------- */

document.addEventListener("wheel",event=>{

    const now=Date.now();

    if(now-lastWheel<850) return;

    if(Math.abs(event.deltaY)<30) return;

    if(event.target.closest("#menu,#sciencePanel,#notesPanel")) return;

    lastWheel=now;

    if(event.deltaY>0) nextSlide();
    else previousSlide();

},{passive:true});


/* ---------- SWIPE ---------- */

document.addEventListener("touchstart",event=>{
    touchStartX=event.changedTouches[0].clientX;
    touchStartY=event.changedTouches[0].clientY;
},{passive:true});

document.addEventListener("touchend",event=>{

    const dx=event.changedTouches[0].clientX-touchStartX;
    const dy=event.changedTouches[0].clientY-touchStartY;

    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)) {
        if(dx<0) nextSlide();
        else previousSlide();
    }

},{passive:true});

/* ---------- TIMER GERAL DE 10 MINUTOS ---------- */

startTime=Date.now();

const totalDuration=SLIDES.reduce((sum,s)=>sum+s.tempo,0)*60;

function formatTime(seconds) {

    const mins=Math.floor(seconds/60);
    const secs=Math.floor(seconds%60);

    return String(mins).padStart(2,"0")+":"+
           String(secs).padStart(2,"0");
}

function updateTimer() {

    const elapsed=(Date.now()-startTime)/1000;

    const expected=SLIDES
        .slice(0,current)
        .reduce((sum,s)=>sum+s.tempo,0)*60;

    const currentSlideTime=SLIDES[current].tempo*60;

    const slideElapsed=(Date.now()-activeSlideStart)/1000;

    const target=expected+currentSlideTime;

    const difference=elapsed-target;

    const timer=document.getElementById("timer");
    const status=document.getElementById("timerStatus");

    timer.firstChild.textContent=formatTime(elapsed);

    timer.classList.remove("late","early");

    if(elapsed>totalDuration) {
        status.textContent="TEMPO EXCEDIDO";
        timer.classList.add("late");
    } else if(difference>20) {
        status.textContent="ATRASADO";
        timer.classList.add("late");
    } else if(difference<-20) {
        status.textContent="ADIANTADO";
        timer.classList.add("early");
    } else {
        status.textContent="NO RITMO";
    }

    const remaining=Math.max(0,currentSlideTime-slideElapsed);

    timer.title=
        `Tempo previsto do slide: ${SLIDES[current].tempo} min. `+
        `Tempo restante estimado neste slide: ${formatTime(remaining)}. `+
        `Duração total prevista: ${formatTime(totalDuration)}.`;

}

timerInterval=setInterval(updateTimer,500);


/* =========================================================
   NÃO PRECISA MEXER — 5. FUNDO DE PARTÍCULAS E CURSOR
========================================================= */

(function(){

    const canvas=document.getElementById("universe");
    const ctx=canvas.getContext("2d");
    const cursor=document.getElementById("cursor-glow");

    let width,height;
    let particles=[];
    let mouse={x:-1000,y:-1000};
    let animationFrame;

    const isTouch=window.matchMedia("(pointer: coarse)").matches;

    function resize() {

        width=window.innerWidth;
        height=window.innerHeight;

        const dpr=Math.min(window.devicePixelRatio||1,2);

        canvas.width=width*dpr;
        canvas.height=height*dpr;

        ctx.setTransform(dpr,0,0,dpr,0,0);

        const count=reducedMotion?20:
            Math.min(110,Math.floor(width*height/13000));

        particles=Array.from({length:count},()=>({
            x:Math.random()*width,
            y:Math.random()*height,
            vx:(Math.random()-.5)*.35,
            vy:(Math.random()-.5)*.35,
            radius:Math.random()*2+1,
            phase:Math.random()*Math.PI*2
        }));
    }

    window.addEventListener("resize",resize);

    if(!isTouch) {

        window.addEventListener("mousemove",event=>{

            mouse.x=event.clientX;
            mouse.y=event.clientY;

            if(!reducedMotion) {
                cursor.style.left=mouse.x+"px";
                cursor.style.top=mouse.y+"px";
            }

        });

        window.addEventListener("mouseleave",()=>{
            mouse.x=-1000;
            mouse.y=-1000;
        });

    } else {
        cursor.style.display="none";
    }


    function animate() {

        if(reducedMotion) {
            ctx.clearRect(0,0,width,height);
            particles.forEach(p=>{
                ctx.beginPath();
                ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
                ctx.fillStyle="rgba(255,120,65,.3)";
                ctx.fill();
            });
            return;
        }

        ctx.clearRect(0,0,width,height);

        const time=Date.now()*.001;

        particles.forEach(p=>{

            let dx=mouse.x-p.x;
            let dy=mouse.y-p.y;

            let distance=Math.sqrt(dx*dx+dy*dy);

            if(distance<180 && distance>0) {

                const force=(1-distance/180)*.08;

                // As partículas se afastam suavemente do cursor.
                p.vx-=dx/distance*force;
                p.vy-=dy/distance*force;

            }

            p.x+=p.vx;
            p.y+=p.vy;

            p.vx*=.99;
            p.vy*=.99;

            p.x+=Math.sin(time+p.phase)*.12;
            p.y+=Math.cos(time+p.phase)*.12;

            if(p.x<0) p.x=width;
            if(p.x>width) p.x=0;
            if(p.y<0) p.y=height;
            if(p.y>height) p.y=0;

            const proximity=Math.max(0,1-distance/180);

            const alpha=.2+proximity*.75;

            ctx.beginPath();
            ctx.arc(p.x,p.y,p.radius+proximity*1.5,0,Math.PI*2);

            ctx.fillStyle=`rgba(255,${100+proximity*90},${65+proximity*40},${alpha})`;
            ctx.shadowBlur=proximity*18;
            ctx.shadowColor="#ff743d";
            ctx.fill();
            ctx.shadowBlur=0;

        });

        // Ondas de calor distribuídas pelo fundo.
        for(let i=0;i<4;i++) {

            const x=width*(.15+i*.23);
            const y=height*(.35+Math.sin(time*.4+i)*.2);

            ctx.beginPath();

            ctx.ellipse(
                x,y,
                60+Math.sin(time+i)*15,
                9,
                Math.sin(time*.2+i)*.3,
                0,Math.PI*2
            );

            ctx.strokeStyle="rgba(255,90,55,.08)";
            ctx.lineWidth=2;
            ctx.stroke();
        }

        animationFrame=requestAnimationFrame(animate);

    }

    resize();
    animate();

    // Efeito parallax e brilho dos cards.
    document.addEventListener("mousemove",event=>{

        if(isTouch||reducedMotion) return;

        const x=(event.clientX/window.innerWidth-.5);
        const y=(event.clientY/window.innerHeight-.5);

        const activeSlide=document.querySelector(".slide.active");

        if(!activeSlide) return;

        activeSlide.querySelectorAll(".image-frame").forEach(el=>{
            el.style.transform=
                `perspective(900px) rotateY(${x*4}deg) rotateX(${-y*4}deg)`;
        });

        activeSlide.querySelectorAll(".card").forEach(card=>{

            const rect=card.getBoundingClientRect();

            const localX=event.clientX-rect.left;
            const localY=event.clientY-rect.top;

            card.style.setProperty("--mx",localX+"px");
            card.style.setProperty("--my",localY+"px");

            if(rect.width>0 && rect.height>0) {
                card.style.transform=
                    `perspective(1000px) rotateY(${x*2}deg) rotateX(${-y*2}deg)`;
            }

        });

    });

    document.addEventListener("mouseleave",()=>{
        document.querySelectorAll(".card,.image-frame").forEach(el=>{
            el.style.transform="";
        });
    });

})();


/* =========================================================
   NÃO PRECISA MEXER — 6. LIMPEZA E PROTEÇÃO
========================================================= */

// Atualiza o slide ao utilizar o histórico do navegador.
window.addEventListener("hashchange",()=>{

    const match=location.hash.match(/slide-(\d+)/);

    if(!match) return;

    const index=SLIDES.findIndex(s=>s.id===Number(match[1]));

    if(index>=0 && index!==current) goToSlide(index);

});

// Garante a limpeza dos módulos ao sair da página.
window.addEventListener("pagehide",()=>{
    if(moduleCleanup) moduleCleanup();
    clearInterval(timerInterval);
});

</script>
